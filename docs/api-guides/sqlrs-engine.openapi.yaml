openapi: 3.1.0
info:
  title: The sqlrs engine API
  version: 0.1.0
  description: |
    sqlrs HTTP API (MVP).
    This file is the design source of truth for the engine API. Local engine
    deployments implement the local runtime subset. Shared/team/cloud
    deployments additionally implement remote-only user and organization
    management endpoints.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
security:
  - bearerAuth: []
servers:
  - url: http://127.0.0.1:{port}
    description: Local engine endpoint (from engine.json)
    variables:
      port:
        default: "8080"
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Engine health check
      description: Returns engine status. No auth required.
      tags:
        - health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          description: Method not allowed
  /v1/cache/status:
    get:
      operationId: getCacheStatus
      summary: Get bounded-cache diagnostics
      description: |
        Returns current bounded-cache occupancy, policy thresholds, pressure
        reasons, and the latest completed eviction summary.
      tags:
        - cache
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStatus"
        "401":
          description: Unauthorized
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/cache/explain/prepare:
    post:
      operationId: explainPrepareCache
      summary: Explain one prepare-oriented cache decision
      description: |
        Computes the same final prepare signature and cache lookup the engine
        would use for a bound single-stage prepare request, but does not create
        a job, instance, or mutate cache state.
      tags:
        - cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheExplainPrepareRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheExplainPrepareResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "409":
          description: Source inputs missing; client may upload missing blobs or expand the source manifest and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInputsMissingErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/source-blobs/sha256/{digest}:
    put:
      operationId: putSourceBlobSha256
      summary: Upload one remote source content blob
      description: |
        Remote/shared deployments only. Stores one source-input content blob in
        the authenticated actor's scoped content cache. The server verifies the
        uploaded bytes by recomputing `sha256` and comparing it to `{digest}`.
        The operation is idempotent: uploading content that is already present
        succeeds without changing the source cache.
      tags:
        - source
      parameters:
        - in: path
          name: digest
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
          description: Lowercase hex SHA-256 digest without the `sha256:` prefix.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Blob stored or already present.
        "400":
          description: Invalid digest or upload request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "409":
          description: Uploaded content does not match the requested digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Source blob exceeds the configured upload limit (`source_blob_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/prepare-jobs:
    get:
      operationId: listPrepareJobs
      summary: List prepare jobs
      description: Returns prepare jobs.
      tags:
        - prepare
      parameters:
        - in: query
          name: job
          schema:
            type: string
          description: Filter by job id prefix.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrepareJobEntry"
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON stream of PrepareJobEntry objects.
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
    post:
      operationId: createPrepareJob
      summary: Start a prepare job
      description: |
        Starts a prepare job and returns a job reference.
        The engine enforces deterministic defaults for `psql` (`-X` and
        `-v ON_ERROR_STOP=1`) and rejects connection flags.
        When `plan_only` is true, the job computes a plan and does not create
        an instance; the plan tasks are returned in the job status.
      tags:
        - prepare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareJobRequest"
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema:
                type: string
              description: Canonical job status URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareJobAccepted"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "409":
          description: Source inputs missing; client may upload missing blobs or expand the source manifest and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInputsMissingErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/prepare-jobs/{jobId}:
    get:
      operationId: getPrepareJob
      summary: Get prepare job status
      description: Returns job status and result when available.
      tags:
        - prepare
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareJobStatus"
        "401":
          description: Unauthorized
        "400":
          description: Invalid prefix filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
    delete:
      operationId: deletePrepareJob
      summary: Delete a prepare job
      description: |
        Deletes a prepare job by id. This operation is idempotent.
        By default, jobs with started tasks are blocked unless `force` is set.
      tags:
        - prepare
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
        - in: query
          name: force
          schema:
            type: boolean
          description: Allow deletion of jobs with started tasks.
        - in: query
          name: dry_run
          schema:
            type: boolean
          description: |
            Return the deletion tree without making changes.
            When true, the response is always 200 and `outcome` indicates whether
            deletion would succeed.
      responses:
        "200":
          description: OK (deleted or dry-run result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Blocked by safety rules (dry_run=false only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
  /v1/prepare-jobs/{jobId}/cancel:
    post:
      operationId: cancelPrepareJob
      summary: Cancel a prepare job
      description: |
        Requests cancellation for a queued or running prepare job.
        The operation is idempotent:
        - `202 Accepted` when cancellation is requested for `queued` or `running`.
        - `200 OK` when the job is already terminal (`succeeded`, `failed`).
      tags:
        - prepare
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareJobStatus"
        "200":
          description: Already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareJobStatus"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/prepare-jobs/{jobId}/events:
    get:
      operationId: streamPrepareJobEvents
      summary: Stream prepare job events
      description: |
        Streams job events as NDJSON.
        Clients may request a partial stream using an events-based range; if the
        server does not honor the range request, it returns a full 200 response.
      tags:
        - prepare
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
        - in: header
          name: Range
          required: false
          schema:
            type: string
          description: |
            Optional events-based range request, e.g. `events=10-` or `events=10-24`.
            When supported, the server responds with 206 and `Content-Range: events`.
      responses:
        "200":
          description: OK
          headers:
            Accept-Ranges:
              schema:
                type: string
              description: Range unit support (e.g. `events`).
          content:
            application/x-ndjson:
              schema:
                description: Newline-delimited JSON stream of PrepareJobEvent objects.
                $ref: "#/components/schemas/PrepareJobEvent"
        "206":
          description: Partial Content (events range)
          headers:
            Content-Range:
              schema:
                type: string
              description: |
                Events range returned, e.g. `events 10-24/100` or `events 10-*/100`.
            Accept-Ranges:
              schema:
                type: string
              description: Range unit support (e.g. `events`).
          content:
            application/x-ndjson:
              schema:
                description: Newline-delimited JSON stream of PrepareJobEvent objects.
                $ref: "#/components/schemas/PrepareJobEvent"
        "401":
          description: Unauthorized
        "400":
          description: Invalid prefix filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
        "416":
          description: Requested range not satisfiable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      description: Returns task queue entries across jobs.
      tags:
        - tasks
      parameters:
        - in: query
          name: job
          schema:
            type: string
          description: Filter by job id (exact match).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEntry"
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON stream of TaskEntry objects.
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
  /v1/config:
    get:
      operationId: getConfig
      summary: Get server config
      description: |
        Returns the server configuration.
        When `path` is provided, returns the value at that path.
        When `effective` is true, defaults are applied before returning the value.
      tags:
        - config
      parameters:
        - in: query
          name: path
          required: false
          schema:
            type: string
          description: JS-style path (e.g. `orchestrator.jobs.maxIdentical`).
        - in: query
          name: effective
          required: false
          schema:
            type: boolean
          description: Return value after applying defaults.
      responses:
        "200":
          description: Config value or full config object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ConfigValue"
                  - $ref: "#/components/schemas/ConfigMap"
        "400":
          description: Invalid path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Path not found
    patch:
      operationId: setConfig
      summary: Set config value
      description: |
        Sets a configuration value by path.
        The value is validated against the server schema and semantic rules.
      tags:
        - config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigSetRequest"
      responses:
        "200":
          description: Updated config value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValue"
        "400":
          description: Invalid value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: removeConfig
      summary: Remove config value
      description: |
        Removes a configuration value by path.
      tags:
        - config
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
          description: JS-style path (e.g. `orchestrator.jobs.maxIdentical`).
        - in: query
          name: effective
          required: false
          schema:
            type: boolean
          description: Return value after applying defaults.
      responses:
        "200":
          description: Updated config value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValue"
        "400":
          description: Invalid path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Path not found
  /v1/config/schema:
    get:
      operationId: getConfigSchema
      summary: Get config schema
      description: Returns the JSON Schema for server config validation.
      tags:
        - config
      responses:
        "200":
          description: JSON Schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSchema"
        "401":
          description: Unauthorized
  /v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Get current user profile
      description: |
        Remote/shared deployments only. Returns the current user profile,
        linked external identities, and organization memberships.
      tags:
        - users
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: Current entity tag for conditional updates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResult"
        "401":
          description: Unauthorized
        "404":
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: putCurrentUser
      summary: Create or update current user profile
      description: |
        Remote/shared deployments only.

        Conditional PUT for the current authenticated external identity. The
        server derives `provider + issuer + subject` from validated bearer-token
        claims.

        Clients must send exactly one HTTP precondition:

        - `If-None-Match: *` for self-registration create-only behavior.
        - `If-Match: <etag>` for update-only changes to an existing profile.

        Missing preconditions are rejected with `428 Precondition Required`.
        Sending both preconditions is rejected with `400`. If
        self-registration is disabled and no current user profile exists yet,
        create-only requests are rejected with `403`.
      tags:
        - users
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
          description: Use `*` for self-registration create-only behavior.
        - in: header
          name: If-Match
          required: false
          schema:
            type: string
          description: Use the current ETag for update-only changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileWriteRequest"
      responses:
        "200":
          description: Current user profile updated
          headers:
            ETag:
              schema:
                type: string
              description: New entity tag for the updated current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResult"
        "201":
          description: Current user profile created
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for the created current user profile.
            Location:
              schema:
                type: string
              description: Current user resource URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResult"
        "400":
          description: Invalid input or conflicting preconditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Self-registration disabled or forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          description: Precondition required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/users/by-identity:
    get:
      operationId: getUserByIdentity
      summary: Get a user by external identity
      description: |
        Remote/shared deployments only.

        Administrator operation that resolves a user profile by the natural
        external identity key `provider + issuer + subject`.
      tags:
        - users
      parameters:
        - in: query
          name: provider
          required: true
          schema:
            type: string
            default: oidc
          description: External identity provider kind.
        - in: query
          name: issuer
          required: true
          schema:
            type: string
          description: OAuth/OIDC issuer identifier.
        - in: query
          name: subject
          required: true
          schema:
            type: string
          description: Provider-local subject identifier.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: Current entity tag for conditional updates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Administrator permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: External identity not linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: putUserByIdentity
      summary: Create or update a user by external identity
      description: |
        Remote/shared deployments only.

        Administrator operation keyed by the natural external identity
        `provider + issuer + subject`.

        Clients must send exactly one HTTP precondition:

        - `If-None-Match: *` for create-only provisioning.
        - `If-Match: <etag>` for update-only changes to an existing profile.

        Missing preconditions are rejected with `428 Precondition Required`.
        Sending both preconditions is rejected with `400`. The server enforces
        external identity uniqueness over `provider + issuer + subject`.
      tags:
        - users
      parameters:
        - in: query
          name: provider
          required: true
          schema:
            type: string
            default: oidc
          description: External identity provider kind.
        - in: query
          name: issuer
          required: true
          schema:
            type: string
          description: OAuth/OIDC issuer identifier.
        - in: query
          name: subject
          required: true
          schema:
            type: string
          description: Provider-local subject identifier.
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
          description: Use `*` for create-only provisioning.
        - in: header
          name: If-Match
          required: false
          schema:
            type: string
          description: Use the current ETag for update-only changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileWriteRequest"
      responses:
        "200":
          description: User profile updated
          headers:
            ETag:
              schema:
                type: string
              description: New entity tag for the updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResult"
        "201":
          description: User profile created
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for the created user profile.
            Location:
              schema:
                type: string
              description: Identity-keyed user resource URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Administrator permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          description: Precondition failed (identity already linked or stale ETag)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          description: Precondition required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: List current user's organizations
      description: |
        Remote/shared deployments only. Returns organizations visible to the
        current authenticated user.
      tags:
        - organizations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMembershipView"
        "401":
          description: Unauthorized
        "404":
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrganization
      summary: Create an organization
      description: |
        Remote/shared deployments only. Creates a new organization and makes
        the current registered user its `admin`. In the first slice, the server
        rejects organization creation for users that already belong to an
        organization.
      tags:
        - organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationCreateResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already taken or user is already attached to an organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/organizations/{orgRef}:
    get:
      operationId: getOrganization
      summary: Get an organization visible to current user
      description: |
        Remote/shared deployments only. Returns an organization by id or slug
        when it is visible to the current authenticated user. Non-members
        receive `404`.
      tags:
        - organizations
      parameters:
        - in: path
          name: orgRef
          required: true
          schema:
            type: string
          description: Organization id or slug.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembershipView"
        "401":
          description: Unauthorized
        "404":
          description: User profile or visible organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/names:
    get:
      operationId: listNames
      summary: List names
      description: Returns name bindings.
      tags:
        - names
      parameters:
        - in: query
          name: instance
          schema:
            type: string
          description: Filter by instance id.
        - in: query
          name: state
          schema:
            type: string
          description: Filter by state id.
        - in: query
          name: image
          schema:
            type: string
          description: Filter by base image id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NameEntry"
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON stream of NameEntry objects.
        "401":
          description: Unauthorized
  /v1/names/{name}:
    get:
      operationId: getName
      summary: Get a name binding
      description: Returns a single name binding.
      tags:
        - names
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameEntry"
        "404":
          description: Not found
        "401":
          description: Unauthorized
  /v1/instances:
    get:
      operationId: listInstances
      summary: List instances
      description: Returns instances.
      tags:
        - instances
      parameters:
        - in: query
          name: id_prefix
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8,}$"
          description: Case-insensitive hex id prefix (min 8 chars).
        - in: query
          name: state
          schema:
            type: string
          description: Filter by state id.
        - in: query
          name: image
          schema:
            type: string
          description: Filter by base image id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstanceEntry"
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON stream of InstanceEntry objects.
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
  /v1/instances/{instanceId}:
    get:
      operationId: getInstance
      summary: Get an instance
      description: |
        Returns a single instance by id. If the path segment does not match the
        instance id format, it is treated as a name alias. If it matches the id
        format, the engine first attempts id lookup, then falls back to name.
        When resolved by name, the response is a temporary redirect to the
        canonical id-based URL.
      tags:
        - instances
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceEntry"
        "307":
          description: Temporary redirect to canonical instance id URL
          headers:
            Location:
              schema:
                type: string
              description: Canonical instance URL.
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      operationId: deleteInstance
      summary: Delete an instance
      description: |
        Deletes a single instance by id. This operation is idempotent.
        The response includes a deletion tree with blocked reasons when removal
        is not possible.
      tags:
        - instances
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            type: string
        - in: query
          name: force
          schema:
            type: boolean
          description: Ignore active connections.
        - in: query
          name: dry_run
          schema:
            type: boolean
          description: |
            Return the deletion tree without making changes.
            When true, the response is always 200 and `outcome` indicates whether
            deletion would succeed.
      responses:
        "200":
          description: OK (deleted or dry-run result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Blocked by safety rules (dry_run=false only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
  /v1/runs:
    post:
      operationId: runCommand
      summary: Run a command against an instance
      description: |
        Executes a run kind command against an existing instance and streams
        stdout/stderr/exit events. The stream may also include log events for
        instance recovery when a missing container is recreated. If `command`
        is omitted, the default command for the selected kind is used.
      tags:
        - run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Streamed run output
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Instance not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflicting run arguments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/states:
    get:
      operationId: listStates
      summary: List states
      description: Returns states.
      tags:
        - states
      parameters:
        - in: query
          name: id_prefix
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8,}$"
          description: Case-insensitive hex id prefix (min 8 chars).
        - in: query
          name: kind
          schema:
            type: string
          description: Filter by prepare kind.
        - in: query
          name: image
          schema:
            type: string
          description: Filter by base image id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateEntry"
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON stream of StateEntry objects.
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
  /v1/states/{stateId}:
    get:
      operationId: getState
      summary: Get a state
      description: Returns a single state.
      tags:
        - states
      parameters:
        - in: path
          name: stateId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateEntry"
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      operationId: deleteState
      summary: Delete a state
      description: |
        Deletes a single state by id. This operation is idempotent.
        By default, the state must have no descendants. When `recurse` is set,
        the engine returns a full deletion tree and only deletes when all nodes
        are allowed. Partial deletion is not performed.
      tags:
        - states
      parameters:
        - in: path
          name: stateId
          required: true
          schema:
            type: string
        - in: query
          name: recurse
          schema:
            type: boolean
          description: Allow removal of descendant states and instances.
        - in: query
          name: force
          schema:
            type: boolean
          description: Ignore active connections.
        - in: query
          name: dry_run
          schema:
            type: boolean
          description: |
            Return the deletion tree without making changes.
            When true, the response is always 200 and `outcome` indicates whether
            deletion would succeed.
      responses:
        "200":
          description: OK (deleted or dry-run result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Blocked by safety rules (dry_run=false only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - version
        - instanceId
        - pid
      properties:
        ok:
          type: boolean
          description: True if the engine is healthy.
        version:
          type: string
          description: Engine version string.
        instanceId:
          type: string
          description: Unique engine instance identifier.
        pid:
          type: integer
          format: int32
          description: Engine process id.
      examples:
        - ok: true
          version: dev
          instanceId: 9f4d2d4b6c1a4a4ea2d39d1f7b0d8a21
          pid: 12345
    CacheEvictionSummary:
      type: object
      additionalProperties: false
      required:
        - completed_at
        - trigger
        - evicted_count
        - freed_bytes
        - blocked_count
        - reclaimable_bytes
        - usage_bytes_before
        - usage_bytes_after
        - free_bytes_before
        - free_bytes_after
      properties:
        completed_at:
          type: string
          format: date-time
        trigger:
          type: string
          description: Trigger that initiated the latest eviction run.
        evicted_count:
          type: integer
          format: int32
        freed_bytes:
          type: integer
          format: int64
        blocked_count:
          type: integer
          format: int32
        reclaimable_bytes:
          type: integer
          format: int64
        usage_bytes_before:
          type: integer
          format: int64
        usage_bytes_after:
          type: integer
          format: int64
        free_bytes_before:
          type: integer
          format: int64
        free_bytes_after:
          type: integer
          format: int64
    CacheStatus:
      type: object
      additionalProperties: false
      required:
        - usage_bytes
        - effective_max_bytes
        - reserve_bytes
        - high_watermark
        - low_watermark
        - min_state_age
        - store_total_bytes
        - store_free_bytes
        - state_count
        - reclaimable_bytes
        - blocked_count
        - pressure_reasons
      properties:
        usage_bytes:
          type: integer
          format: int64
        configured_max_bytes:
          anyOf:
            - type: integer
              format: int64
            - type: "null"
          description: Null when store-coupled mode is active.
        effective_max_bytes:
          type: integer
          format: int64
        reserve_bytes:
          type: integer
          format: int64
        high_watermark:
          type: number
        low_watermark:
          type: number
        min_state_age:
          type: string
        store_total_bytes:
          type: integer
          format: int64
        store_free_bytes:
          type: integer
          format: int64
        state_count:
          type: integer
          format: int32
        reclaimable_bytes:
          type: integer
          format: int64
        blocked_count:
          type: integer
          format: int32
        pressure_reasons:
          type: array
          items:
            type: string
        last_eviction:
          anyOf:
            - $ref: "#/components/schemas/CacheEvictionSummary"
            - type: "null"
    SourceContentHash:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
      description: SHA-256 content hash with the `sha256:` prefix.
    SourceManifestPath:
      type: string
      minLength: 1
      description: |
        Workspace-relative slash-separated path. Remote requests must not send
        absolute host paths, drive-qualified paths, or paths that escape the
        workspace root.
    SourceWorkspaceRef:
      type: object
      additionalProperties: false
      required:
        - root_path
        - work_dir
      properties:
        root_id:
          type: string
          description: Client-local workspace root identifier for diagnostics and retries.
        root_path:
          type: string
          minLength: 1
          description: |
            Absolute logical path of the client workspace root, in the same OS
            path flavor as file-bearing request arguments. It is a resolution
            coordinate and is never opened as a server filesystem path.
        work_dir:
          type: string
          minLength: 1
          description: |
            Absolute logical effective command working directory within
            `root_path`, in the same OS path flavor. Plain `psql` includes are
            resolved from this directory.
      description: Client path context used to bind absolute arguments to the virtual workspace.
    SourceDirectoryEntry:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
      properties:
        name:
          type: string
          minLength: 1
          description: Directory-entry basename.
        kind:
          type: string
          enum: [file, directory]
      description: One entry in a complete workspace-relative directory listing.
    SourceDirectoryListing:
      type: object
      additionalProperties: false
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SourceDirectoryEntry"
        complete:
          type: boolean
          default: true
          description: False values are ignored by the server and may cause another missing-input response.
      description: Complete listing for the directory at the map key.
    SourceManifest:
      type: object
      additionalProperties: false
      required:
        - workspace_ref
      properties:
        workspace_ref:
          $ref: "#/components/schemas/SourceWorkspaceRef"
        files:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SourceContentHash"
          description: Map from workspace-relative source file path to verified client-side content hash.
        directories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SourceDirectoryListing"
          description: Map from workspace-relative directory path to complete directory listing.
      description: |
        Optional remote-source manifest attached to file-bearing prepare and
        cache-explain requests. The server uses this manifest with its scoped
        content cache to build a virtual workspace for authoritative
        format-specific input resolution. File-bearing request arguments retain
        absolute client paths; `workspace_ref` binds those logical coordinates
        to workspace-relative manifest keys. An empty manifest is a valid
        first-round handshake and may produce `source_inputs_missing`.
    SourceMissingManifestEntry:
      type: object
      additionalProperties: false
      required:
        - path
        - kind
      properties:
        path:
          $ref: "#/components/schemas/SourceManifestPath"
        kind:
          type: string
          enum: [file_hash, directory_listing]
          description: Type of manifest data the server needs to continue source resolution.
        reason:
          type: string
          description: Optional diagnostic reason such as `referenced_file` or `directory_traversal`.
      description: Manifest information the client should add before retrying the request.
    SourceMissingBlob:
      type: object
      additionalProperties: false
      required:
        - path
        - hash
      properties:
        path:
          $ref: "#/components/schemas/SourceManifestPath"
        hash:
          $ref: "#/components/schemas/SourceContentHash"
      description: Source content blob absent from the server's scoped content cache.
    SourceInputsMissingErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [source_inputs_missing]
        message:
          type: string
        missing_manifest_entries:
          type: array
          items:
            $ref: "#/components/schemas/SourceMissingManifestEntry"
          default: []
        missing_blobs:
          type: array
          items:
            $ref: "#/components/schemas/SourceMissingBlob"
          default: []
      description: |
        Recoverable response used by remote clients. The client may upload the
        missing blobs, expand the source manifest with requested hashes or
        directory listings, and retry the original request.
    CacheExplainPrepareRequest:
      oneOf:
        - $ref: "#/components/schemas/CacheExplainPrepareRequestPsql"
        - $ref: "#/components/schemas/CacheExplainPrepareRequestLiquibase"
      discriminator:
        propertyName: prepare_kind
        mapping:
          psql: "#/components/schemas/CacheExplainPrepareRequestPsql"
          lb: "#/components/schemas/CacheExplainPrepareRequestLiquibase"
    CacheExplainPrepareRequestPsql:
      type: object
      additionalProperties: false
      required:
        - prepare_kind
        - image_id
        - psql_args
      properties:
        prepare_kind:
          type: string
          enum: [psql]
          description: Prepare adapter kind.
        image_id:
          type: string
          description: Base Docker image id to use.
        psql_args:
          type: array
          description: |
            Arguments passed to `psql` (excluding connection flags). Argument
            ordering is preserved. File paths must already be absolute and
            normalized for the bound client execution context. With
            `source_manifest`, they are logical client coordinates and are not
            opened on the server filesystem.
          items:
            type: string
        stdin:
          type: string
          description: SQL content to use for stdin when `psql_args` includes `-f -`.
        source_manifest:
          $ref: "#/components/schemas/SourceManifest"
    CacheExplainPrepareRequestLiquibase:
      type: object
      additionalProperties: false
      required:
        - prepare_kind
        - image_id
        - liquibase_args
      properties:
        prepare_kind:
          type: string
          enum: [lb]
          description: Prepare adapter kind.
        image_id:
          type: string
          description: Base Docker image id to use.
        liquibase_args:
          type: array
          description: |
            Arguments passed to Liquibase. Argument ordering is preserved and
            path-bearing arguments must already reflect the absolute bound
            client execution context. With `source_manifest`, they are logical
            client coordinates and are not opened on the server filesystem.
          items:
            type: string
        liquibase_exec:
          type: string
          description: Optional Liquibase executable override selected by the CLI.
        liquibase_exec_mode:
          type: string
          description: Optional Liquibase executable mode selected by the CLI.
        liquibase_env:
          type: object
          additionalProperties:
            type: string
          description: Optional environment variables passed through to Liquibase.
        work_dir:
          type: string
          description: Absolute bound client working directory for the Liquibase invocation.
        source_manifest:
          $ref: "#/components/schemas/SourceManifest"
    CacheExplainPrepareResponse:
      type: object
      additionalProperties: false
      required:
        - decision
        - reason_code
        - signature
      properties:
        decision:
          type: string
          enum: [hit, miss]
          description: |
            Final-state cache decision for the bound prepare invocation.
        reason_code:
          type: string
          description: |
            Diagnostic reason. The current implementation returns
            `exact_state_match` for a hit and `no_matching_state` for a miss.
            More specific miss classification is tracked in
            https://github.com/kimak-irmagi/sqlrs/issues/92.
        signature:
          type: string
          description: Engine-computed final prepare signature used for cache lookup.
        matched_state_id:
          anyOf:
            - type: string
            - type: "null"
          description: Matching cached state id when `decision=hit`.
        resolved_image_id:
          anyOf:
            - type: string
            - type: "null"
          description: Resolved image id when the engine can report it.
    PrepareJobRequest:
      oneOf:
        - $ref: "#/components/schemas/PrepareJobRequestPsql"
        - $ref: "#/components/schemas/PrepareJobRequestLiquibase"
      discriminator:
        propertyName: prepare_kind
        mapping:
          psql: "#/components/schemas/PrepareJobRequestPsql"
          lb: "#/components/schemas/PrepareJobRequestLiquibase"
    PrepareJobRequestPsql:
      type: object
      additionalProperties: false
      required:
        - prepare_kind
        - image_id
        - psql_args
      properties:
        prepare_kind:
          type: string
          enum: [psql]
          description: Prepare adapter kind.
        image_id:
          type: string
          description: Base Docker image id to use.
        psql_args:
          type: array
          description: |
            Arguments passed to `psql` (excluding connection flags). Argument
            ordering is preserved. File paths must be absolute. With
            `source_manifest`, they are logical client coordinates and are not
            opened on the server filesystem.
          items:
            type: string
        stdin:
          type: string
          description: SQL content to use for stdin when `psql_args` includes `-f -`.
        source_manifest:
          $ref: "#/components/schemas/SourceManifest"
        plan_only:
          type: boolean
          description: When true, only the plan is computed and no instance is created.
    PrepareJobRequestLiquibase:
      type: object
      additionalProperties: false
      required:
        - prepare_kind
        - image_id
        - liquibase_args
      properties:
        prepare_kind:
          type: string
          enum: [lb]
          description: Prepare adapter kind.
        image_id:
          type: string
          description: Base Docker image id to use.
        liquibase_args:
          type: array
          description: |
            Arguments passed to Liquibase. Argument ordering is preserved and
            path-bearing arguments must already be normalized for the absolute
            bound client execution context. With `source_manifest`, they are
            logical client coordinates and are not opened on the server
            filesystem.
          items:
            type: string
        liquibase_exec:
          type: string
          description: Optional Liquibase executable override selected by the CLI.
        liquibase_exec_mode:
          type: string
          description: Optional Liquibase executable mode selected by the CLI.
        liquibase_env:
          type: object
          additionalProperties:
            type: string
          description: Optional environment variables passed through to Liquibase.
        work_dir:
          type: string
          description: Absolute bound client working directory for the Liquibase invocation.
        source_manifest:
          $ref: "#/components/schemas/SourceManifest"
        plan_only:
          type: boolean
          description: When true, only the plan is computed and no instance is created.
    ConfigSetRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - value
      properties:
        path:
          type: string
          description: JS-style path (e.g. `orchestrator.jobs.maxIdentical`).
        value:
          $ref: "#/components/schemas/JSONValue"
    ConfigValue:
      type: object
      additionalProperties: false
      required:
        - path
        - value
      properties:
        path:
          type: string
        value:
          $ref: "#/components/schemas/JSONValue"
    ConfigMap:
      type: object
      additionalProperties: true
      description: Full server config object.
    ConfigSchema:
      type: object
      additionalProperties: true
      description: JSON Schema for config validation.
    JSONValue:
      oneOf:
        - type: "null"
        - type: string
        - type: number
        - type: integer
        - type: boolean
        - type: object
          additionalProperties: true
        - type: array
          items: {}
    UserProfileWriteRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: Optional profile display name.
        email:
          type: string
          format: email
          description: Optional profile email.
    UserProfileResult:
      type: object
      additionalProperties: false
      required:
        - user
        - identities
        - memberships
      properties:
        status:
          type: string
          enum: [created, existing, updated]
          description: Present when the response comes from a create or update command.
        user:
          $ref: "#/components/schemas/UserProfile"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentity"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembershipView"
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - email
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Stable sqlrs user id.
        display_name:
          type: string
        email:
          anyOf:
            - type: string
              format: email
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExternalIdentity:
      type: object
      additionalProperties: false
      required:
        - provider
        - issuer
        - subject
      properties:
        provider:
          type: string
          default: oidc
          description: External identity provider kind.
        issuer:
          type: string
          description: OAuth/OIDC issuer identifier.
        subject:
          type: string
          description: Provider-local subject identifier.
    OrganizationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - slug
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9]|-(?=[a-z0-9])){1,61}[a-z0-9]$"
          description: Lowercase organization slug, 3 to 63 characters.
        display_name:
          type: string
          description: Optional human-readable organization name.
    OrganizationCreateResponse:
      type: object
      additionalProperties: false
      required:
        - organization
        - membership
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        membership:
          $ref: "#/components/schemas/OrganizationMembership"
    OrganizationMembershipView:
      type: object
      additionalProperties: false
      required:
        - organization
        - membership
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        membership:
          $ref: "#/components/schemas/OrganizationMembership"
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - display_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Stable sqlrs organization id.
        slug:
          type: string
          description: Stable human-readable organization reference.
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationMembership:
      type: object
      additionalProperties: false
      required:
        - user_id
        - organization_id
        - role
        - created_at
      properties:
        user_id:
          type: string
        organization_id:
          type: string
        role:
          type: string
          enum: [admin]
        created_at:
          type: string
          format: date-time
    PreparePlanTask:
      oneOf:
        - $ref: "#/components/schemas/PreparePlanTaskPlan"
        - $ref: "#/components/schemas/PreparePlanTaskResolveImage"
        - $ref: "#/components/schemas/PreparePlanTaskStateExecute"
        - $ref: "#/components/schemas/PreparePlanTaskPrepareInstance"
      discriminator:
        propertyName: type
        mapping:
          plan: "#/components/schemas/PreparePlanTaskPlan"
          resolve_image: "#/components/schemas/PreparePlanTaskResolveImage"
          state_execute: "#/components/schemas/PreparePlanTaskStateExecute"
          prepare_instance: "#/components/schemas/PreparePlanTaskPrepareInstance"
    PreparePlanTaskInput:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          enum: [image, state]
        id:
          type: string
    PreparePlanTaskPlan:
      type: object
      additionalProperties: false
      required:
        - task_id
        - type
        - planner_kind
      properties:
        task_id:
          type: string
        type:
          type: string
          enum: [plan]
        planner_kind:
          type: string
    PreparePlanTaskResolveImage:
      type: object
      additionalProperties: false
      required:
        - task_id
        - type
        - image_id
        - resolved_image_id
      properties:
        task_id:
          type: string
        type:
          type: string
          enum: [resolve_image]
        image_id:
          type: string
        resolved_image_id:
          type: string
    PreparePlanTaskStateExecute:
      type: object
      additionalProperties: false
      required:
        - task_id
        - type
        - input
        - task_hash
        - output_state_id
        - cached
      properties:
        task_id:
          type: string
        type:
          type: string
          enum: [state_execute]
        input:
          $ref: "#/components/schemas/PreparePlanTaskInput"
        task_hash:
          type: string
        output_state_id:
          type: string
        cached:
          type: boolean
    PreparePlanTaskPrepareInstance:
      type: object
      additionalProperties: false
      required:
        - task_id
        - type
        - input
        - instance_mode
      properties:
        task_id:
          type: string
        type:
          type: string
          enum: [prepare_instance]
        input:
          $ref: "#/components/schemas/PreparePlanTaskInput"
        instance_mode:
          type: string
          enum: [ephemeral]
    PrepareJobAccepted:
      type: object
      additionalProperties: false
      required:
        - job_id
        - status_url
      properties:
        job_id:
          type: string
          description: Prepare job id.
        status_url:
          type: string
          description: URL for job status polling.
        events_url:
          type: string
          description: URL for job event streaming.
        status:
          type: string
          enum: [queued]
    PrepareJobStatus:
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
        - prepare_kind
        - image_id
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        prepare_kind:
          type: string
        image_id:
          type: string
        plan_only:
          type: boolean
          description: True when the job computes a plan only.
        prepare_args_normalized:
          type: string
          description: Normalized prepare arguments (when available).
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        tasks:
          type: array
          description: Present when the plan is available (plan-only or planned job).
          items:
            $ref: "#/components/schemas/PreparePlanTask"
        result:
          anyOf:
            - $ref: "#/components/schemas/PrepareJobResult"
            - type: "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/ErrorResponse"
            - type: "null"
    PrepareJobEntry:
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
        - prepare_kind
        - image_id
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        prepare_kind:
          type: string
        image_id:
          type: string
          description: Original requested image reference for the job.
        resolved_image_id:
          type: string
          description: Resolved digest-based image reference when available.
        prepare_args_normalized:
          type: string
          description: Normalized prepare arguments when available for the job entry.
        signature:
          type: string
          description: Engine-computed job signature used for retention and drift diagnostics when available.
        plan_only:
          type: boolean
          description: True when the job computes a plan only.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    PrepareJobEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - ts
      properties:
        type:
          type: string
          enum: [status, log, result, error, task]
        ts:
          type: string
          format: date-time
        task_id:
          type: string
          description: Present for task status events.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        message:
          type: string
        result:
          $ref: "#/components/schemas/PrepareJobResult"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    PrepareJobResult:
      type: object
      additionalProperties: false
      required:
        - dsn
        - instance_id
        - state_id
        - image_id
        - prepare_kind
        - prepare_args_normalized
      properties:
        dsn:
          type: string
          description: DSN for the prepared instance.
        instance_id:
          type: string
        state_id:
          type: string
        image_id:
          type: string
        prepare_kind:
          type: string
        prepare_args_normalized:
          type: string
    RunRequest:
      type: object
      additionalProperties: false
      required:
        - instance_ref
        - kind
        - args
      properties:
        instance_ref:
          type: string
          description: Instance id or name.
        kind:
          type: string
          enum: [psql, pgbench]
        command:
          type:
            - string
            - "null"
          description: Optional command; defaults to the run kind command.
        args:
          type: array
          description: Command arguments; applies to the default command when `command` is omitted. Ignored when `steps` is provided.
          items:
            type: string
        stdin:
          type:
            - string
            - "null"
          description: Optional stdin payload for the run command.
        steps:
          type: array
          description: Optional psql run steps (mutually exclusive with args/stdin).
          items:
            $ref: "#/components/schemas/RunStep"
    RunStep:
      type: object
      additionalProperties: false
      required:
        - args
      properties:
        args:
          type: array
          items:
            type: string
        stdin:
          type:
            - string
            - "null"
          description: Optional stdin payload for this step.
    RunEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - ts
      properties:
        type:
          type: string
          enum: [start, stdout, stderr, exit, error, log]
        ts:
          type: string
          format: date-time
        instance_id:
          type: string
          description: Present for start events.
        data:
          type: string
          description: Output chunk for stdout/stderr events or log message text.
        exit_code:
          type: integer
          format: int32
          description: Process exit code for exit events.
        error:
          $ref: "#/components/schemas/ErrorResponse"
    TaskEntry:
      type: object
      additionalProperties: false
      required:
        - task_id
        - job_id
        - type
        - status
      properties:
        task_id:
          type: string
        job_id:
          type: string
        type:
          type: string
          enum: [plan, resolve_image, state_execute, prepare_instance]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        planner_kind:
          type: string
        input:
          $ref: "#/components/schemas/PreparePlanTaskInput"
        task_hash:
          type: string
        output_state_id:
          type: string
        cached:
          type: boolean
        instance_mode:
          type: string
          enum: [ephemeral]
        image_id:
          type: string
          description: Requested image reference relevant to the task, when applicable.
        resolved_image_id:
          type: string
          description: Resolved digest-based image reference relevant to the task, when available.
        args_summary:
          type: string
          description: Stable one-line summary for human-oriented task listings.
        changeset_id:
          type: string
        changeset_author:
          type: string
        changeset_path:
          type: string
    DeleteResult:
      type: object
      additionalProperties: false
      required:
        - dry_run
        - outcome
        - root
      properties:
        dry_run:
          type: boolean
        outcome:
          type: string
          enum: [deleted, would_delete, blocked]
        root:
          $ref: "#/components/schemas/DeleteTreeNode"
    DeleteTreeNode:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          enum: [state, instance, job]
        id:
          type: string
        connections:
          type: integer
          format: int32
          minimum: 0
          description: Active connections (instances only).
        runtime_id:
          type: string
          description: Runtime/container identifier for instance nodes.
        blocked:
          type: string
          enum: [active_connections, active_tasks, has_descendants, blocked_by_descendant]
          description: Reason the node cannot be deleted.
        children:
          type: array
          items:
            $ref: "#/components/schemas/DeleteTreeNode"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
    NameEntry:
      type: object
      additionalProperties: false
      required:
        - name
        - image_id
        - state_id
        - status
      properties:
        name:
          type: string
        instance_id:
          type:
            - string
            - "null"
        image_id:
          type: string
        state_id:
          type: string
        state_fingerprint:
          type: string
        status:
          type: string
          enum: [active, missing, expired]
        last_used_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
    InstanceEntry:
      type: object
      additionalProperties: false
      required:
        - instance_id
        - image_id
        - state_id
        - created_at
        - status
      properties:
        instance_id:
          type: string
        image_id:
          type: string
        state_id:
          type: string
        name:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        status:
          type: string
          enum: [active, expired, orphaned]
    StateEntry:
      type: object
      additionalProperties: false
      required:
        - state_id
        - image_id
        - prepare_kind
        - prepare_args_normalized
        - created_at
        - refcount
      properties:
        state_id:
          type: string
        parent_state_id:
          anyOf:
            - type: string
            - type: "null"
          description: Parent state id (null for roots).
        image_id:
          type: string
        prepare_kind:
          type: string
        prepare_args_normalized:
          type: string
        created_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
          format: int64
        last_used_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        use_count:
          anyOf:
            - type: integer
              format: int64
            - type: "null"
        min_retention_until:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        refcount:
          type: integer
          format: int32
