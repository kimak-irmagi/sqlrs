name: Liquibase cost prerequisites (explicit opt-in, not acceptance)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: liquibase-cost-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'performance:cost-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify workflow and ordinary helpers
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm install --frozen-lockfile
          node --test scripts/performance/*.test.mjs
          cd backend/local-engine-go
          go test ./internal/preparecost ./internal/runtime -count=1 -timeout=4m
          go vet ./internal/preparecost ./internal/runtime
          go test -race ./internal/prepare -run '^TestLiquibaseInventoryCache' -count=1 -timeout=3m
          (cd ../../test/performance/liquibase && GOWORK=off go test ./... -count=1 -timeout=4m)
      - name: Acquire public native fixture
        run: |
          docker pull liquibase/liquibase:5.0.4
          docker pull postgres:17
          node scripts/fetch-sql-scripts.mjs --lock --source-prefix jdbc-postgresql-
      - name: Qualify sync and actual session acquisition
        working-directory: backend/local-engine-go
        env:
          SQLRS_COST_NATIVE_PROBE: '1'
          SQLRS_LIQUIBASE_DOCKER_E2E: '1'
        run: |
          go test ./internal/runtime -run '^TestCostSyncImplementationDocker$' -v -count=1 -timeout=8m
          go test ./internal/runtime -run '^(TestCostHelperFlushBoundariesDocker|TestLiquibaseStepCaptureReusableRunnerDocker)$' -v -count=1 -timeout=8m
          go test ./internal/runtime -run '^TestCostHelperTimersDocker$' -v -count=1 -timeout=6m
          go test ./internal/runtime -run '^TestCombinedCapturePrune(NativeDocker|WrapperNativeDocker)$' -v -count=1 -timeout=6m
          go test ./internal/runtime -run '^TestStepResultEnvelopeNativeDocker$' -v -count=1 -timeout=6m
      - name: Qualify native host attribution and unchanged prepare
        working-directory: backend/local-engine-go
        env:
          SQLRS_LIQUIBASE_DOCKER_E2E: '1'
          SQLRS_PREPARE_COST: '0'
          SQLRS_JDBC_JAR_PATH: ${{ github.workspace }}/dist/deps/postgresql-42.7.13.jar
        run: |
          go test ./internal/prepare -run '^(TestCostMainPathNamedAttributionDocker|TestMainPathLiquibasePrepareDocker|TestCombinedCapturePruneKnownFailureDocker|TestStepResultMainPathNativeDocker)$' -v -count=1 -timeout=8m
          go test ./internal/prepare -run '^TestCompleteTimelineMainPathDocker$' -v -count=1 -timeout=8m
          go test ./internal/prepare -run '^(TestPlanningDBHandoffDocker|TestNormalPlanningDBHandoffOrder)$' -v -count=1 -timeout=10m
