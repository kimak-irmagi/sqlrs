name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Use pnpm
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Lint OpenAPI
        run: pnpm run lint:openapi

      - name: Generate OpenAPI docs (markdown)
        run: pnpm run docs:openapi:md

      - name: Generate schema docs (markdown)
        run: pnpm run docs:schemas

      - name: Commit regenerated docs
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo "Docs are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore(docs): regenerate api docs"
          git push

      - name: Fail if docs are out of date (forks)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: git diff --exit-code

  runtime-v2:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (Runtime v2)
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/libs/runtime-go/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run Runtime v2 tests and enforce coverage
        working-directory: backend/libs/runtime-go
        shell: bash
        run: |
          set -euo pipefail
          profile=../../../coverage-runtime-v2-${{ matrix.runner }}.out
          go test . -covermode=count -coverprofile=coverage-core.out
          go test ./resolver -covermode=count -coverprofile=coverage-resolver.out
          core=$(go tool cover -func=coverage-core.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          resolver=$(go tool cover -func=coverage-resolver.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Runtime v2 coverage: core=${core}% resolver=${resolver}%"
          awk -v value="$core" 'BEGIN { if (value + 0 < 95) exit 1 }'
          awk -v value="$resolver" 'BEGIN { if (value + 0 < 95) exit 1 }'
          head -n 1 coverage-core.out > "$profile"
          tail -n +2 coverage-core.out >> "$profile"
          tail -n +2 coverage-resolver.out >> "$profile"

      - name: Check Runtime v2 dependency boundary
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: backend/libs/runtime-go
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... \
            | grep -v '^$' \
            | grep -v '^github.com/kimak-irmagi/sqlrs/backend/libs/runtime-go\($\|/\)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected non-standard Runtime v2 dependencies:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Run Runtime v2 race detector
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: backend/libs/runtime-go
        run: go test -race -count=1 ./...

      - name: Verify Runtime v2 golden vectors independently
        shell: bash
        run: |
          node scripts/maintenance/verify-runtime-v2-golden.mjs backend/libs/runtime-go/testdata/golden
          node scripts/maintenance/verify-runtime-v2-extension-golden.mjs backend/libs/runtime-go/testdata/extension-golden.json

      - name: Verify Runtime v2 release workflow contract
        if: matrix.runner == 'ubuntu-24.04'
        run: node --test scripts/maintenance/runtime-go-release-workflow.test.mjs

      - name: Test standalone Runtime v2 consumer
        working-directory: test/runtime-v2-consumer
        shell: bash
        run: GOWORK=off go test ./...

      - name: Upload Runtime v2 coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-runtime-v2-${{ matrix.runner }}
          path: coverage-runtime-v2-${{ matrix.runner }}.out

  coverage-engine:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest, windows-latest]
        group: [fast, slow]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (engine)
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/local-engine-go/go.mod
          cache-dependency-path: backend/local-engine-go/go.sum

      - name: Run engine coverage (${{ matrix.group }})
        working-directory: backend/local-engine-go
        shell: bash
        run: |
          set -euo pipefail
          test_log=../../engine-test-output-${{ matrix.runner }}-${{ matrix.group }}.log
          json_log=../../engine-test-output-${{ matrix.runner }}-${{ matrix.group }}.json
          if [[ "${{ matrix.group }}" == "slow" ]]; then
            pkgs=(
              ./internal/httpapi
              ./internal/prepare
              ./cmd/sqlrs-engine
              ./internal/run
              ./internal/store/sqlite
              ./internal/prepare/queue
            )
          else
            pkgs=()
            while IFS= read -r pkg; do
              pkgs+=("$pkg")
            done < <(go list ./... | grep -v -E 'github.com/sqlrs/engine-local/internal/httpapi$|github.com/sqlrs/engine-local/internal/prepare$|github.com/sqlrs/engine-local/cmd/sqlrs-engine$|github.com/sqlrs/engine-local/internal/run$|github.com/sqlrs/engine-local/internal/store/sqlite$|github.com/sqlrs/engine-local/internal/prepare/queue$')
          fi
          test_timeout=10m
          # SQLite/filesystem suites can exceed Go's default on Windows hosted
          # runners. Keep all tests and a bounded timeout for this slower group.
          if [[ "${{ matrix.runner }}" == "windows-latest" && "${{ matrix.group }}" == "slow" ]]; then
            test_timeout=20m
          fi
          go test "${pkgs[@]}" -timeout="$test_timeout" -covermode=count -coverprofile=../../coverage-engine-${{ matrix.runner }}-${{ matrix.group }}.out -json \
            | tee "$json_log" "$test_log"

      - name: Print failed tests (${{ matrix.group }})
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          json_log=engine-test-output-${{ matrix.runner }}-${{ matrix.group }}.json
          if [[ ! -f "$json_log" ]]; then
            echo "test json log not found: $json_log"
            exit 0
          fi

          echo "Fail events from $json_log:"
          grep '"Action":"fail"' "$json_log" || true

      - name: Upload engine test output (${{ matrix.group }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-test-output-${{ matrix.runner }}-${{ matrix.group }}
          path: engine-test-output-${{ matrix.runner }}-${{ matrix.group }}.log
          if-no-files-found: ignore

      - name: Upload engine coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-engine-${{ matrix.runner }}-${{ matrix.group }}
          path: coverage-engine-${{ matrix.runner }}-${{ matrix.group }}.out

      - name: Upload engine json artifacts (${{ matrix.group }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-test-json-${{ matrix.runner }}-${{ matrix.group }}
          path: engine-test-output-${{ matrix.runner }}-${{ matrix.group }}.json
          if-no-files-found: ignore

  coverage-engine-managed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (engine)
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/local-engine-go/go.mod
          cache-dependency-path: backend/local-engine-go/go.sum

      - name: Pull official PostgreSQL fixture
        run: docker pull postgres:17

      - name: Run native managed-access coverage
        working-directory: backend/local-engine-go
        run: go test -tags managedintegration ./internal/dbms -count=1 -timeout=6m -covermode=count -coverprofile=../../coverage-engine-ubuntu-24.04-managed.out

      - name: Upload managed-access coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-engine-ubuntu-24.04-managed
          path: coverage-engine-ubuntu-24.04-managed.out

  coverage-cli:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (cli)
        uses: actions/setup-go@v7
        with:
          go-version-file: frontend/cli-go/go.mod
          cache-dependency-path: frontend/cli-go/go.sum

      - name: Run CLI coverage
        working-directory: frontend/cli-go
        shell: bash
        run: go test ./... -covermode=count -coverprofile=../../coverage-cli-${{ matrix.runner }}.out

      - name: Re-run failing CLI app tests with JSON diagnostics
        if: failure()
        working-directory: frontend/cli-go
        shell: bash
        run: |
          set -euo pipefail
          json_log=../../cli-test-output-${{ matrix.runner }}.json
          text_log=../../cli-test-output-${{ matrix.runner }}.log
          go test ./internal/app -covermode=count -count=1 -json 2>&1 \
            | tee "$json_log" "$text_log" || true

      - name: Print failed CLI app tests
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          json_log=cli-test-output-${{ matrix.runner }}.json
          if [[ ! -f "$json_log" ]]; then
            echo "test json log not found: $json_log"
            exit 0
          fi

          echo "Fail events from $json_log:"
          grep '"Action":"fail"' "$json_log" || true

      - name: Upload CLI test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-test-output-${{ matrix.runner }}
          path: |
            cli-test-output-${{ matrix.runner }}.json
            cli-test-output-${{ matrix.runner }}.log
          if-no-files-found: ignore

      - name: Upload CLI coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cli-${{ matrix.runner }}
          path: coverage-cli-${{ matrix.runner }}.out

  coverage-merge:
    runs-on: ubuntu-24.04
    needs:
      - coverage-engine
      - coverage-engine-managed
      - coverage-cli
      - runtime-v2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/local-engine-go/go.mod
          cache-dependency-path: backend/local-engine-go/go.sum

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: coverage-artifacts

      - name: Merge coverage
        id: coverage
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t engine_files < <(find coverage-artifacts -name 'coverage-engine-*.out' -print | sort)
          mapfile -t cli_files < <(find coverage-artifacts -name 'coverage-cli-*.out' -print | sort)
          if [[ ${#engine_files[@]} -eq 0 || ${#cli_files[@]} -eq 0 ]]; then
            echo "missing coverage artifacts"
            exit 1
          fi

          merge_profiles() {
            local output=$1
            shift
            awk 'BEGIN{FS=" "} $1!="mode:"{key=$1" "$2; if(!(key in max) || $3>max[key]) max[key]=$3} END{for(k in max){print k" "max[k]}}' "$@" \
              | sort > "${output}.body"
            echo "mode: set" > "$output"
            cat "${output}.body" >> "$output"
            rm -f "${output}.body"
          }

          merge_profiles coverage-engine.raw "${engine_files[@]}"
          merge_profiles coverage-cli.raw "${cli_files[@]}"
          merge_profiles coverage.raw coverage-engine.raw coverage-cli.raw

          total=$(go tool cover -func=coverage.raw | awk '/^total:/ {print $3}')
          engine=$(go tool cover -func=coverage-engine.raw | awk '/^total:/ {print $3}')
          cli=$(go tool cover -func=coverage-cli.raw | awk '/^total:/ {print $3}')
          engine_value="${engine%\%}"
          cli_value="${cli%\%}"
          echo "Coverage gates: engine=${engine} cli=${cli}"
          awk -v value="$engine_value" 'BEGIN { if (value + 0 < 95) exit 1 }'
          awk -v value="$cli_value" 'BEGIN { if (value + 0 < 95) exit 1 }'
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: |
            coverage.raw
            coverage-cli.raw
            coverage-engine.raw

      - name: Summarize low coverage
        id: coverage-details
        shell: bash
        run: |
          set -euo pipefail

          summarize_funcs() {
            local profile=$1
            local limit=$2
            go tool cover -func="$profile" \
              | awk '$1 != "total:" {sub(/%/,"",$3); printf "%06.2f\t%s\t%s\n",$3,$1,$2}' \
              | sort -n \
              | head -n "$limit" \
              | awk -F '\t' '{pct=$1+0; printf "- %s %s (%.1f%%)\n", $2, $3, pct}'
          }

          summarize_files() {
            local profile=$1
            local limit=$2
            go tool cover -func="$profile" \
              | awk '$1 != "total:" {split($1,a,":"); file=a[1]; sub(/%/,"",$3); sum[file]+=$3; count[file]++} END {for (f in sum){printf "%06.2f\t%s\n", sum[f]/count[f], f}}' \
              | sort -n \
              | head -n "$limit" \
              | awk -F '\t' '{pct=$1+0; printf "- %s (%.1f%%)\n", $2, pct}'
          }

          engine_funcs=$(summarize_funcs coverage-engine.raw 10 || true)
          engine_files=$(summarize_files coverage-engine.raw 10 || true)
          cli_funcs=$(summarize_funcs coverage-cli.raw 10 || true)
          cli_files=$(summarize_files coverage-cli.raw 10 || true)

          emit() {
            local name=$1
            local value=$2
            {
              echo "$name<<EOF"
              echo "$value"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          emit "engine_low_funcs" "${engine_funcs:-"- (no data)"}"
          emit "engine_low_files" "${engine_files:-"- (no data)"}"
          emit "cli_low_funcs" "${cli_funcs:-"- (no data)"}"
          emit "cli_low_files" "${cli_files:-"- (no data)"}"

      - name: Find coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@v4
        id: coverage-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "Coverage summary"

      - name: Create coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.coverage-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Coverage summary (all platforms):
            - engine: ${{ steps.coverage.outputs.engine }}
            - cli: ${{ steps.coverage.outputs.cli }}
            - combined: ${{ steps.coverage.outputs.total }}

            Lowest-covered engine files:
            ${{ steps.coverage-details.outputs.engine_low_files }}

            Lowest-covered engine functions:
            ${{ steps.coverage-details.outputs.engine_low_funcs }}

            Lowest-covered cli files:
            ${{ steps.coverage-details.outputs.cli_low_files }}

            Lowest-covered cli functions:
            ${{ steps.coverage-details.outputs.cli_low_funcs }}

      - name: Update coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.coverage-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.coverage-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            Coverage summary (all platforms):
            - engine: ${{ steps.coverage.outputs.engine }}
            - cli: ${{ steps.coverage.outputs.cli }}
            - combined: ${{ steps.coverage.outputs.total }}

            Lowest-covered engine files:
            ${{ steps.coverage-details.outputs.engine_low_files }}

            Lowest-covered engine functions:
            ${{ steps.coverage-details.outputs.engine_low_funcs }}

            Lowest-covered cli files:
            ${{ steps.coverage-details.outputs.cli_low_files }}

            Lowest-covered cli functions:
            ${{ steps.coverage-details.outputs.cli_low_funcs }}

      - name: Comment coverage on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Coverage summary (all platforms):',
              `- engine: ${process.env.COVERAGE_ENGINE}`,
              `- cli: ${process.env.COVERAGE_CLI}`,
              `- combined: ${process.env.COVERAGE_TOTAL}`,
              '',
              'Lowest-covered engine files:',
              process.env.COVERAGE_ENGINE_FILES,
              '',
              'Lowest-covered engine functions:',
              process.env.COVERAGE_ENGINE_FUNCS,
              '',
              'Lowest-covered cli files:',
              process.env.COVERAGE_CLI_FILES,
              '',
              'Lowest-covered cli functions:',
              process.env.COVERAGE_CLI_FUNCS,
            ].join('\n')

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            })
        env:
          COVERAGE_ENGINE: ${{ steps.coverage.outputs.engine }}
          COVERAGE_CLI: ${{ steps.coverage.outputs.cli }}
          COVERAGE_TOTAL: ${{ steps.coverage.outputs.total }}
          COVERAGE_ENGINE_FILES: ${{ steps.coverage-details.outputs.engine_low_files }}
          COVERAGE_ENGINE_FUNCS: ${{ steps.coverage-details.outputs.engine_low_funcs }}
          COVERAGE_CLI_FILES: ${{ steps.coverage-details.outputs.cli_low_files }}
          COVERAGE_CLI_FUNCS: ${{ steps.coverage-details.outputs.cli_low_funcs }}

      - name: Upload CLI coverage to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage-cli.raw
          format: golang
          fail-on-error: false
          debug: true
          base-path: frontend/cli-go
          coverage-reporter-version: v0.6.14

      - name: Upload engine coverage to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage-engine.raw
          format: golang
          fail-on-error: false
          debug: true
          base-path: backend/local-engine-go
          coverage-reporter-version: v0.6.14

