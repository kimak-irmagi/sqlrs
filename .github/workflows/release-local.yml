name: release-local

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release candidate version (e.g., v0.1.0-rc.1)"
        required: true
  push:
    tags:
      - "v*"

env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  test-cli:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: frontend/cli-go/go.mod

      - name: Run CLI tests
        working-directory: frontend/cli-go
        run: go test ./...

  lint-openapi:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Use pnpm
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Lint OpenAPI
        run: pnpm run lint:openapi

      - name: Generate OpenAPI docs (markdown)
        run: pnpm run docs:openapi:md

      - name: Generate schema docs (markdown)
        run: pnpm run docs:schemas

  test-engine:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/local-engine-go/go.mod

      - name: Run engine tests
        working-directory: backend/local-engine-go
        run: go test ./...

  build-rc:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: ${{ matrix.runner }}
    needs: [test-cli, test-engine, lint-openapi]
    env:
      RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      ENGINE_DIR: dist/engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            exe: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            exe: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            exe: ".exe"
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            exe: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            exe: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release versions
        id: version
        shell: pwsh
        run: |
          $raw = "${{ env.RAW_VERSION }}"
          if ([string]::IsNullOrWhiteSpace($raw)) {
            throw "release version is empty"
          }
          $base = $raw -replace '-rc\.[0-9]+$',''
          if ([string]::IsNullOrWhiteSpace($base)) {
            throw "base version is empty"
          }
          "raw=$raw" >> $env:GITHUB_OUTPUT
          "base=$base" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: frontend/cli-go/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build engine (unix)
        if: runner.os != 'Windows'
        working-directory: backend/local-engine-go
        run: |
          mkdir -p "${{ github.workspace }}/${{ env.ENGINE_DIR }}/${{ matrix.goos }}_${{ matrix.goarch }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -o "${{ github.workspace }}/${{ env.ENGINE_DIR }}/${{ matrix.goos }}_${{ matrix.goarch }}/sqlrs-engine${{ matrix.exe }}" \
            ./cmd/sqlrs-engine

      - name: Build engine (windows)
        if: runner.os == 'Windows'
        working-directory: backend/local-engine-go
        run: |
          $outDir = "${{ github.workspace }}\\${{ env.ENGINE_DIR }}\\${{ matrix.goos }}_${{ matrix.goarch }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $env:GOOS = "${{ matrix.goos }}"
          $env:GOARCH = "${{ matrix.goarch }}"
          $env:CGO_ENABLED = "0"
          go build -o "$outDir\\sqlrs-engine${{ matrix.exe }}" ./cmd/sqlrs-engine

          $linuxOutDir = "${{ github.workspace }}\\${{ env.ENGINE_DIR }}\\linux_${{ matrix.goarch }}"
          New-Item -ItemType Directory -Force -Path $linuxOutDir | Out-Null
          $env:GOOS = "linux"
          go build -o "$linuxOutDir\\sqlrs-engine" ./cmd/sqlrs-engine

      - name: Build local release (unix)
        if: runner.os != 'Windows'
        run: >
          node scripts/release-local.mjs
          --version "${{ steps.version.outputs.base }}"
          --os "${{ matrix.goos }}"
          --arch "${{ matrix.goarch }}"
          --engine-bin "${{ github.workspace }}/${{ env.ENGINE_DIR }}/${{ matrix.goos }}_${{ matrix.goarch }}/sqlrs-engine${{ matrix.exe }}"

      - name: Build local release (windows)
        if: runner.os == 'Windows'
        run: >
          node scripts/release-local.mjs
          --version "${{ steps.version.outputs.base }}"
          --os "${{ matrix.goos }}"
          --arch "${{ matrix.goarch }}"
          --engine-bin "${{ github.workspace }}/${{ env.ENGINE_DIR }}/${{ matrix.goos }}_${{ matrix.goarch }}/sqlrs-engine${{ matrix.exe }}"
          --wsl-engine-bin "${{ github.workspace }}/${{ env.ENGINE_DIR }}/linux_${{ matrix.goarch }}/sqlrs-engine"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqlrs_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/release/sqlrs_${{ steps.version.outputs.base }}_${{ matrix.goos }}_${{ matrix.goarch }}.*

  assemble-release-manifest:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    needs: [build-rc]
    outputs:
      base_version: ${{ steps.version.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve release versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ env.RELEASE_VERSION }}"
          if [[ -z "$raw" ]]; then
            echo "release version is empty" >&2
            exit 1
          fi
          base="${raw%-rc.*}"
          if [[ -z "$base" ]]; then
            echo "base version is empty" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sqlrs_*
          merge-multiple: true
          path: release-assets

      - name: Create release manifest
        run: >
          node scripts/e2e-release/create-release-manifest.mjs
          --version "${{ steps.version.outputs.base }}"
          --input-dir release-assets
          --output release-assets/release-manifest.json
          --source-sha "${{ github.sha }}"
          --workflow-run-id "${{ github.run_id }}"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-assets/release-manifest.json

  e2e-happy:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: ${{ matrix.runner }}
    needs: [build-rc, assemble-release-manifest]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows
        scenario:
          - hp-psql-chinook
          - hp-psql-sakila
          - hp-lb-jhipster
          - cache-pressure-chinook
        snapshot_backend:
          - copy
          - btrfs
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
            wsl_distro: Ubuntu-24.04
        exclude:
          - platform: windows
            scenario: hp-psql-sakila
          - platform: windows
            scenario: hp-lb-jhipster
          - platform: windows
            scenario: cache-pressure-chinook
          - platform: linux
            scenario: hp-lb-jhipster
            snapshot_backend: btrfs
          - platform: linux
            scenario: cache-pressure-chinook
            snapshot_backend: btrfs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        if: matrix.platform == 'linux'
        run: corepack enable

      - name: Use pnpm
        if: matrix.platform == 'linux'
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install JS dependencies
        if: matrix.platform == 'linux'
        run: pnpm install --frozen-lockfile

      - name: Fetch example SQL datasets (locked)
        if: matrix.platform == 'linux'
        run: pnpm fetch:sql --lock

      - name: Fetch Chinook SQL asset (locked)
        if: matrix.platform == 'windows' && matrix.scenario == 'hp-psql-chinook'
        shell: pwsh
        run: |
          $dst = Join-Path $env:GITHUB_WORKSPACE "examples\chinook\Chinook_PostgreSql.sql"
          $url = "https://raw.githubusercontent.com/lerocha/chinook-database/master/ChinookDatabase/DataSources/Chinook_PostgreSql.sql"
          $expected = "e3fde5c1a5b51a2a91429a702c9ca6e69ba56e6c7f5e112724d70c3d03db695e"

          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dst) | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $dst

          $actual = (Get-FileHash -Algorithm SHA256 -Path $dst).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Chinook SQL sha256 mismatch: expected=$expected actual=$actual"
          }

      - name: Install btrfs tooling
        if: matrix.platform == 'linux' && matrix.snapshot_backend == 'btrfs'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y btrfs-progs

      - name: Set up Docker on host
        if: matrix.platform == 'windows'
        uses: docker/setup-docker-action@v4

      - name: Set up WSL
        if: matrix.platform == 'windows'
        uses: Vampire/setup-wsl@v6
        with:
          distribution: ${{ matrix.wsl_distro }}

      - name: Show host WSL status
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          wsl --status
          wsl --list --verbose

      - name: Require elevated host session
        if: matrix.platform == 'windows' && matrix.snapshot_backend == 'btrfs'
        shell: pwsh
        run: |
          $isAdmin = (New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) {
            throw "This release E2E cell requires Administrator privileges for sqlrs init --snapshot btrfs."
          }

      - name: Ensure Docker in WSL distro (prereq)
        if: matrix.platform == 'windows'
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          unset DOCKER_HOST
          unset DOCKER_CONTEXT
          if ! command -v docker >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update
              apt-get install -y docker.io
            else
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi
          fi
          if ! docker info >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              pkill -f dockerd || true
              pkill -f containerd || true
            else
              sudo pkill -f dockerd || true
              sudo pkill -f containerd || true
            fi
            sleep 2
            if [ "$(id -u)" -eq 0 ]; then
              rm -f /var/run/docker.pid
            else
              sudo rm -f /var/run/docker.pid
            fi
            if [ "$(id -u)" -eq 0 ]; then
              nohup dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2375 --storage-driver=vfs --iptables=false >/tmp/sqlrs-release-dockerd.log 2>&1 &
            else
              nohup sudo dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2375 --storage-driver=vfs --iptables=false >/tmp/sqlrs-release-dockerd.log 2>&1 &
            fi
            ready=0
            for _ in $(seq 1 90); do
              if docker info >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != "1" ]; then
              echo "docker daemon did not become ready" >&2
              tail -n 200 /tmp/sqlrs-release-dockerd.log || true
              exit 1
            fi
          fi
          if ! docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              pkill -f dockerd || true
              pkill -f containerd || true
            else
              sudo pkill -f dockerd || true
              sudo pkill -f containerd || true
            fi
            sleep 2
            if [ "$(id -u)" -eq 0 ]; then
              rm -f /var/run/docker.pid
              nohup dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2375 --storage-driver=vfs --iptables=false >/tmp/sqlrs-release-dockerd.log 2>&1 &
            else
              sudo rm -f /var/run/docker.pid
              nohup sudo dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2375 --storage-driver=vfs --iptables=false >/tmp/sqlrs-release-dockerd.log 2>&1 &
            fi
            ready_tcp=0
            for _ in $(seq 1 90); do
              if docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; then
                ready_tcp=1
                break
              fi
              sleep 2
            done
            if [ "$ready_tcp" != "1" ]; then
              echo "docker daemon tcp endpoint did not become ready" >&2
              tail -n 200 /tmp/sqlrs-release-dockerd.log || true
              exit 1
            fi
          fi
          if [ "$(id -u)" -eq 0 ]; then
            chmod 666 /var/run/docker.sock || true
          else
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version
          docker -H tcp://127.0.0.1:2375 version >/dev/null

      - name: Resolve release versions (linux)
        if: matrix.platform == 'linux'
        id: version-linux
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ env.RELEASE_VERSION }}"
          base="${raw%-rc.*}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Resolve release versions (windows)
        if: matrix.platform == 'windows'
        id: version-windows
        shell: pwsh
        run: |
          $raw = "${{ env.RELEASE_VERSION }}"
          $base = $raw -replace '-rc\.[0-9]+$',''
          if ([string]::IsNullOrWhiteSpace($base)) {
            throw "base version is empty"
          }
          "base=$base" >> $env:GITHUB_OUTPUT

      - name: Download linux rc artifact
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v4
        with:
          name: sqlrs_linux_amd64
          path: rc-artifacts

      - name: Download windows rc artifact
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: sqlrs_windows_amd64
          path: rc-artifacts

      - name: Extract linux bundle
        if: matrix.platform == 'linux'
        id: bundle-linux
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find rc-artifacts -name "sqlrs_${{ steps.version-linux.outputs.base }}_linux_amd64.tar.gz" -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "linux release archive not found" >&2
            exit 1
          fi
          mkdir -p bundle
          tar -xzf "$archive" -C bundle
          bundle_dir="$(find bundle -maxdepth 1 -type d -name "sqlrs_*_linux_amd64" -print -quit)"
          if [[ -z "$bundle_dir" ]]; then
            echo "extracted bundle directory not found" >&2
            exit 1
          fi
          echo "bundle_dir=$bundle_dir" >> "$GITHUB_OUTPUT"

      - name: Extract windows bundle
        if: matrix.platform == 'windows'
        id: bundle-windows
        shell: pwsh
        run: |
          $base = "${{ steps.version-windows.outputs.base }}"
          $bundleRoot = Join-Path $PWD "bundle"
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          $windowsArchive = Get-ChildItem -Path rc-artifacts -Recurse -Filter "sqlrs_${base}_windows_amd64.zip" | Select-Object -First 1
          if (-not $windowsArchive) {
            throw "windows release archive not found"
          }
          Expand-Archive -Path $windowsArchive.FullName -DestinationPath $bundleRoot -Force

          $windowsSqlrs = Get-ChildItem -Path $bundleRoot -Recurse -File -Filter "sqlrs.exe" |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1
          if (-not $windowsSqlrs) {
            throw "sqlrs.exe not found in extracted windows bundle"
          }
          $windowsEngine = Get-ChildItem -Path $bundleRoot -Recurse -File -Filter "sqlrs-engine.exe" |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1
          if (-not $windowsEngine) {
            throw "sqlrs-engine.exe not found in extracted windows bundle"
          }

          $linuxEngine = Get-ChildItem -Path $bundleRoot -Recurse -File -Filter "sqlrs-engine" |
            Where-Object { $_.FullName -match "libexec[\\/]linux-amd64[\\/]sqlrs-engine$" } |
            Select-Object -First 1
          if (-not $linuxEngine) {
            throw "linux sqlrs-engine not found in extracted linux bundle"
          }

          "sqlrs_bin=$($windowsSqlrs.FullName)" >> $env:GITHUB_OUTPUT
      - name: Setup Liquibase latest (linux host)
        if: matrix.platform == 'linux' && matrix.scenario == 'hp-lb-jhipster'
        uses: liquibase/setup-liquibase@v2
        with:
          version: '5.0.1'
          edition: 'community'

      - name: Install Liquibase PostgreSQL driver via lpm (linux host)
        if: matrix.platform == 'linux' && matrix.scenario == 'hp-lb-jhipster'
        shell: bash
        run: |
          set -euo pipefail
          if command -v lpm >/dev/null 2>&1; then
            lpm add postgresql --global
          else
            liquibase lpm add postgresql --global
          fi
          liquibase --version

      - name: Run happy-path scenario (linux)
        if: matrix.platform == 'linux'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/xdg-config
          XDG_STATE_HOME: ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/xdg-state
          XDG_CACHE_HOME: ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/xdg-cache
        shell: bash
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}"
          mkdir -p "${XDG_CONFIG_HOME}" "${XDG_STATE_HOME}" "${XDG_CACHE_HOME}"
          case "${{ matrix.scenario }}" in
            hp-psql-sakila) scenario_timeout="45m" ;;
            hp-lb-jhipster) scenario_timeout="45m" ;;
            cache-pressure-chinook) scenario_timeout="30m" ;;
            *) scenario_timeout="15m" ;;
          esac
          case "${{ matrix.scenario }}" in
            cache-pressure-chinook)
              node scripts/e2e-release/run-cache-pressure-scenario.mjs \
                --scenario "${{ matrix.scenario }}" \
                --snapshot-backend "${{ matrix.snapshot_backend }}" \
                --scenarios "test/e2e/release/scenarios.json" \
                --sqlrs "${{ steps.bundle-linux.outputs.bundle_dir }}/sqlrs" \
                --engine "${{ steps.bundle-linux.outputs.bundle_dir }}/sqlrs-engine" \
                --timeout "$scenario_timeout" \
                --out-dir "$out_dir"
              ;;
            *)
              node scripts/e2e-release/run-scenario.mjs \
                --scenario "${{ matrix.scenario }}" \
                --snapshot-backend "${{ matrix.snapshot_backend }}" \
                --scenarios "test/e2e/release/scenarios.json" \
                --sqlrs "${{ steps.bundle-linux.outputs.bundle_dir }}/sqlrs" \
                --engine "${{ steps.bundle-linux.outputs.bundle_dir }}/sqlrs-engine" \
                --flow-runs "2" \
                --timeout "$scenario_timeout" \
                --out-dir "$out_dir"
              node scripts/e2e-release/normalize-output.mjs \
                --scenario "${{ matrix.scenario }}" \
                --scenarios "test/e2e/release/scenarios.json" \
                --input "$out_dir/raw-stdout.log" \
                --output "$out_dir/normalized-stdout.log"
              case "${{ matrix.scenario }}" in
                hp-psql-chinook) golden="test/e2e/release/hp-psql-chinook/golden.txt" ;;
                hp-psql-sakila) golden="test/e2e/release/hp-psql-sakila/golden.txt" ;;
                hp-lb-jhipster) golden="test/e2e/release/hp-lb-jhipster/golden.txt" ;;
                *) echo "unknown scenario: ${{ matrix.scenario }}" >&2; exit 1 ;;
              esac
              node scripts/e2e-release/compare-golden.mjs \
                --expected "$golden" \
                --actual "$out_dir/normalized-stdout.log" \
                --diff "$out_dir/diff.log"
              ;;
          esac
      - name: Run happy-path scenario (windows host)
        if: matrix.platform == 'windows'
        env:
          SCENARIO_ID: ${{ matrix.scenario }}
          SNAPSHOT_BACKEND: ${{ matrix.snapshot_backend }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scenario = $env:SCENARIO_ID
          $outDir = Join-Path $env:RUNNER_TEMP "e2e\windows\$scenario-$env:SNAPSHOT_BACKEND"
          $workspaceDir = Join-Path $outDir "workspace"
          $storeRoot = Join-Path $outDir "store"
          $storeImage = Join-Path $storeRoot "btrfs.vhdx"
          $sqlrs = "${{ steps.bundle-windows.outputs.sqlrs_bin }}"
          $isBtrfs = $env:SNAPSHOT_BACKEND -eq "btrfs"
          Remove-Item Env:DOCKER_HOST -ErrorAction SilentlyContinue
          Remove-Item Env:SQLRS_DOCKER_HOST_PATH_STYLE -ErrorAction SilentlyContinue
          Remove-Item Env:SQLRS_STATE_DB -ErrorAction SilentlyContinue

          if (-not $isBtrfs) {
            $wslAddresses = (wsl.exe -d "${{ matrix.wsl_distro }}" -- hostname -I) -split '\s+'
            $wslAddress = $wslAddresses | Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($wslAddress)) {
              throw "Could not determine the WSL IPv4 address for the Linux Docker daemon."
            }
            $env:DOCKER_HOST = "tcp://${wslAddress}:2375"
            $env:SQLRS_DOCKER_HOST_PATH_STYLE = "linux"
          }

          $env:APPDATA = Join-Path $outDir "appdata"
          $env:LOCALAPPDATA = Join-Path $outDir "localappdata"
          $env:SQLRS_STATE_STORE = $storeRoot

          $dirs = @($outDir, $workspaceDir, $storeRoot, $env:APPDATA, $env:LOCALAPPDATA)
          New-Item -ItemType Directory -Force -Path $dirs | Out-Null
          $exampleDir = Join-Path $workspaceDir "chinook"
          New-Item -ItemType Directory -Force -Path $exampleDir | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "examples\chinook\*") -Destination $exampleDir -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "examples\chinook.prep.s9s.yaml") -Destination (Join-Path $workspaceDir "chinook.prep.s9s.yaml") -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE ("test\e2e\release\" + $scenario + "\query.sql")) -Destination (Join-Path $workspaceDir ".e2e-query.sql") -Force

          $initArgs = @(
            "--workspace", $workspaceDir,
            "init", "local",
            "--snapshot", $env:SNAPSHOT_BACKEND
          )
          if ($isBtrfs) {
            $initArgs += @("--store", "image", $storeImage, "--distro", "${{ matrix.wsl_distro }}")
          } else {
            $initArgs += @("--store", "dir", $storeRoot)
          }
          $initArgs += @("--no-start")
          $flowArgs = @(
            "--timeout", "15m",
            "--workspace", $workspaceDir,
            "prepare",
            "chinook",
            "run:psql",
            "--",
            "-At", "-f", ".e2e-query.sql"
          )

          $initCommand = @($sqlrs) + $initArgs
          $flowCommand = @($sqlrs) + $flowArgs
          ($initCommand | ForEach-Object { if ($_ -match '\s') { '"' + ($_ -replace '"', '\"') + '"' } else { $_ } }) -join " " | Out-File -FilePath (Join-Path $outDir "command-init.txt") -Encoding utf8
          ($flowCommand | ForEach-Object { if ($_ -match '\s') { '"' + ($_ -replace '"', '\"') + '"' } else { $_ } }) -join " " | Out-File -FilePath (Join-Path $outDir "command-flow.txt") -Encoding utf8

          Push-Location $workspaceDir
          try {
            & $sqlrs @initArgs 1> (Join-Path $outDir "init-stdout.log") 2> (Join-Path $outDir "init-stderr.log")
            if ($LASTEXITCODE -ne 0) {
              throw "init local --snapshot $env:SNAPSHOT_BACKEND failed with exit code $LASTEXITCODE"
            }

            if ($isBtrfs) {
              wsl.exe -d "${{ matrix.wsl_distro }}" -- bash -lc "docker version" 1> (Join-Path $outDir "docker-version.txt") 2> (Join-Path $outDir "dockerd.log")
              if ($LASTEXITCODE -ne 0) {
                throw "wsl docker prereq check failed with exit code $LASTEXITCODE"
              }
            } else {
              docker version 1> (Join-Path $outDir "docker-version.txt") 2> (Join-Path $outDir "dockerd.log")
              if ($LASTEXITCODE -ne 0) {
                throw "host Docker client could not reach the WSL Linux daemon (DOCKER_HOST=$env:DOCKER_HOST); exit code $LASTEXITCODE"
              }
            }

            & $sqlrs @flowArgs 1> (Join-Path $outDir "raw-stdout.log") 2> (Join-Path $outDir "raw-stderr.log")
            if ($LASTEXITCODE -ne 0) {
              throw "prepare/run flow failed with exit code $LASTEXITCODE"
            }

            & $sqlrs @flowArgs 1> (Join-Path $outDir "raw-stdout-run2.log") 2> (Join-Path $outDir "raw-stderr-run2.log")
            if ($LASTEXITCODE -ne 0) {
              throw "prepare/run flow second pass failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Normalize and compare golden output (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "e2e\windows\${{ matrix.scenario }}-${{ matrix.snapshot_backend }}"
          $golden = "test\e2e\release\${{ matrix.scenario }}\golden.txt"
          node scripts/e2e-release/normalize-output.mjs `
            --scenario "${{ matrix.scenario }}" `
            --scenarios "test/e2e/release/scenarios.json" `
            --input "$outDir/raw-stdout.log" `
            --output "$outDir/normalized-stdout.log"

          node scripts/e2e-release/compare-golden.mjs `
            --expected "$golden" `
            --actual "$outDir/normalized-stdout.log" `
            --diff "$outDir/diff.log"

      - name: Collect WSL dockerd diagnostics
        if: failure() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "e2e\windows\${{ matrix.scenario }}-${{ matrix.snapshot_backend }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          wsl.exe -d "${{ matrix.wsl_distro }}" -- bash -lc "test -f /tmp/sqlrs-release-dockerd.log && cat /tmp/sqlrs-release-dockerd.log || true" `
            1> (Join-Path $outDir "dockerd-wsl.log") `
            2> $null

      - name: Upload Linux E2E diagnostics
        if: failure() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.platform }}-${{ matrix.scenario }}-${{ matrix.snapshot_backend }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/command-init.txt
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/command-config*.txt
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/command-flow*.txt
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/command-status.txt
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/init-stdout.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/init-stderr.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/config-*.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/raw-stdout*.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/raw-stderr*.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/status*.json
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/status*.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/cache-pressure-summary.json
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/normalized-stdout.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/diff.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/result.json
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/scenario.json
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/xdg-state/sqlrs/engine.json
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/xdg-state/sqlrs/logs/engine.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/xdg-state/sqlrs/logs/engine-wsl.log
            ${{ runner.temp }}/e2e/linux/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}/workspace/*.sql
      - name: Upload Windows E2E diagnostics
        if: failure() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.platform }}-${{ matrix.scenario }}-${{ matrix.snapshot_backend }}
          if-no-files-found: warn
          include-hidden-files: true
          path: ${{ runner.temp }}/e2e/windows/${{ matrix.scenario }}-${{ matrix.snapshot_backend }}

  e2e-podman-macos:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: macos-15-intel
    timeout-minutes: 60
    needs: [build-rc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Chinook SQL asset (locked)
        shell: bash
        run: |
          set -euo pipefail
          dst="${GITHUB_WORKSPACE}/examples/chinook/Chinook_PostgreSql.sql"
          url="https://raw.githubusercontent.com/lerocha/chinook-database/master/ChinookDatabase/DataSources/Chinook_PostgreSql.sql"
          expected="e3fde5c1a5b51a2a91429a702c9ca6e69ba56e6c7f5e112724d70c3d03db695e"
          mkdir -p "$(dirname "$dst")"
          curl -fsSL "$url" -o "$dst"
          actual="$(shasum -a 256 "$dst" | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Chinook SQL sha256 mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi

      - name: Resolve release versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ env.RELEASE_VERSION }}"
          base="${raw%-rc.*}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Download darwin rc artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sqlrs_darwin_*
          merge-multiple: true
          path: rc-artifacts

      - name: Extract darwin bundle
        id: bundle-darwin
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find rc-artifacts -name "sqlrs_${{ steps.version.outputs.base }}_darwin_amd64.tar.gz" -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "darwin amd64 release archive not found" >&2
            exit 1
          fi
          mkdir -p bundle
          tar -xzf "$archive" -C bundle
          bundle_dir="$(find bundle -maxdepth 1 -type d -name "sqlrs_*_darwin_amd64" -print -quit)"
          if [[ -z "$bundle_dir" ]]; then
            echo "extracted darwin amd64 bundle directory not found" >&2
            exit 1
          fi
          echo "bundle_dir=$bundle_dir" >> "$GITHUB_OUTPUT"

      - name: Install Podman
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            podman_version="v5.8.5"
            podman_pkg="${RUNNER_TEMP}/podman-installer-macos-amd64.pkg"
            podman_sha256="2677be9fa3bf75f7dbd4dfe5f5039cf105806f102af15ee6c6d174c70dcda3b8"
            podman_url="https://github.com/podman-container-tools/podman/releases/download/${podman_version}/podman-installer-macos-amd64.pkg"
            curl -fsSL "$podman_url" -o "$podman_pkg"
            echo "${podman_sha256}  ${podman_pkg}" | shasum -a 256 -c -
            sudo installer -pkg "$podman_pkg" -target /
          fi
          if ! command -v podman >/dev/null 2>&1; then
            podman_path_file="/etc/paths.d/podman-pkg"
            if [[ ! -r "$podman_path_file" ]]; then
              echo "Podman installer did not publish its executable path" >&2
              exit 1
            fi
            podman_bin_dir="$(head -n 1 "$podman_path_file")"
            if [[ -z "$podman_bin_dir" || ! -x "${podman_bin_dir}/podman" ]]; then
              echo "Podman executable not found in installer path: ${podman_bin_dir}" >&2
              exit 1
            fi
            echo "$podman_bin_dir" >> "$GITHUB_PATH"
            export PATH="${podman_bin_dir}:${PATH}"
          fi
          podman --version

      - name: Start Podman machine
        id: podman_machine
        shell: bash
        run: |
          set -euo pipefail
          machine_name="podman-machine-default"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "socket_path=" >> "$GITHUB_OUTPUT"

          try_provider() {
            local provider="${1:-}"
            local label="${provider:-default}"
            echo "Trying podman provider: ${label}"

            podman machine stop "$machine_name" || true
            podman machine rm -f "$machine_name" || true

            if [[ -n "$provider" ]]; then
              export CONTAINERS_MACHINE_PROVIDER="$provider"
            else
              unset CONTAINERS_MACHINE_PROVIDER || true
            fi

            if ! podman machine init --cpus 2 --memory 4096 --disk-size 20 "$machine_name" >"podman-machine-init-${label}.log" 2>&1; then
              echo "init failed for ${label}"
              tail -n 200 "podman-machine-init-${label}.log" || true
              return 1
            fi

            if ! podman --log-level=debug machine start "$machine_name" >"podman-machine-start-${label}.log" 2>&1; then
              echo "start failed for ${label}"
              tail -n 200 "podman-machine-start-${label}.log" || true
              return 1
            fi

            if ! podman info >"podman-info-${label}.log" 2>&1; then
              echo "podman info failed for ${label}"
              tail -n 200 "podman-info-${label}.log" || true
              return 1
            fi

            socket_path="$(podman machine inspect "$machine_name" --format '{{.ConnectionInfo.PodmanSocket.Path}}' 2>/dev/null || true)"
            echo "socket_path=${socket_path}" >> "$GITHUB_OUTPUT"
            echo "provider ${label} works"
            return 0
          }

          if try_provider ""; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if try_provider "libkrun"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if try_provider "applehv"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Podman machine could not be started on this macOS runner." >&2
          exit 1

      - name: Debug Podman machine on failure
        if: failure() && steps.podman_machine.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          podman --version || true
          podman machine list || true
          podman machine inspect podman-machine-default || true
          ls -la ~/.local/share/containers/podman/machine || true
          find ~/.local/share/containers/podman/machine -maxdepth 3 -type f -name "*.log" -print -exec tail -n 200 {} \; || true

      - name: Run macOS release e2e with podman runtime
        shell: bash
        run: |
          set -euo pipefail
          machine_name="podman-machine-default"
          out_dir="${RUNNER_TEMP}/e2e/darwin/hp-psql-chinook-copy-podman"
          export XDG_CONFIG_HOME="${out_dir}/xdg-config"
          export XDG_STATE_HOME="${out_dir}/xdg-state"
          export XDG_CACHE_HOME="${out_dir}/xdg-cache"
          mkdir -p "${XDG_CONFIG_HOME}" "${XDG_STATE_HOME}" "${XDG_CACHE_HOME}"

          podman machine start "$machine_name" >/tmp/podman-machine-restart.log 2>&1 || true
          socket_path="${{ steps.podman_machine.outputs.socket_path }}"
          if [[ -z "${socket_path}" ]]; then
            socket_path="$(podman machine inspect "$machine_name" --format '{{.ConnectionInfo.PodmanSocket.Path}}' 2>/dev/null || true)"
          fi
          if [[ -n "${socket_path}" ]]; then
            export CONTAINER_HOST="unix://${socket_path}"
            export DOCKER_HOST="${CONTAINER_HOST}"
          fi

          podman system connection list || true
          podman machine list || true
          podman info

          node scripts/e2e-release/run-scenario.mjs \
            --scenario "hp-psql-chinook" \
            --snapshot-backend "copy" \
            --container-runtime "podman" \
            --flow-runs "2" \
            --scenarios "test/e2e/release/scenarios.json" \
            --sqlrs "${{ steps.bundle-darwin.outputs.bundle_dir }}/sqlrs" \
            --engine "${{ steps.bundle-darwin.outputs.bundle_dir }}/sqlrs-engine" \
            --timeout "25m" \
            --out-dir "$out_dir"

          node scripts/e2e-release/normalize-output.mjs \
            --scenario "hp-psql-chinook" \
            --scenarios "test/e2e/release/scenarios.json" \
            --input "$out_dir/raw-stdout.log" \
            --output "$out_dir/normalized-stdout.log"

          node scripts/e2e-release/compare-golden.mjs \
            --expected "test/e2e/release/hp-psql-chinook/golden.txt" \
            --actual "$out_dir/normalized-stdout.log" \
            --diff "$out_dir/diff.log"

      - name: Debug Podman machine after probe failure
        if: failure() && steps.podman_machine.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          machine_name="podman-machine-default"
          podman --version || true
          podman system connection list || true
          podman machine list || true
          podman machine inspect "$machine_name" || true
          podman info || true
          socket_path="${{ steps.podman_machine.outputs.socket_path }}"
          if [[ -n "${socket_path}" ]]; then
            ls -la "$(dirname "${socket_path}")" || true
          fi
          ls -la ~/.config/containers/podman/machine || true
          ls -la ~/.local/share/containers/podman/machine || true
          find ~/.local/share/containers/podman/machine -maxdepth 4 -type f -name "*.log" -print -exec tail -n 200 {} \; || true

      - name: Upload macOS podman release e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-darwin-hp-psql-chinook-copy-podman
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/e2e/darwin/hp-psql-chinook-copy-podman/**
            podman-machine-init-*.log
            podman-machine-start-*.log
            podman-info-*.log

      - name: Stop Podman machine
        if: always()
        shell: bash
        run: |
          podman machine stop podman-machine-default || true

  e2e-smoke:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: ${{ matrix.runner }}
    needs: [build-rc]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os_family: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ env.RELEASE_VERSION }}"
          base="${raw%-rc.*}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Download darwin rc artifacts
        if: matrix.os_family == 'darwin'
        uses: actions/download-artifact@v4
        with:
          pattern: sqlrs_darwin_*
          merge-multiple: true
          path: rc-artifacts

      - name: Extract darwin bundle
        if: matrix.os_family == 'darwin'
        id: bundle-darwin
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          target_arch="amd64"
          if [[ "$host_arch" == "arm64" || "$host_arch" == "aarch64" ]]; then
            target_arch="arm64"
          fi
          archive="$(find rc-artifacts -name "sqlrs_${{ steps.version.outputs.base }}_darwin_${target_arch}.tar.gz" -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "darwin release archive not found for arch=$target_arch" >&2
            exit 1
          fi
          mkdir -p bundle
          tar -xzf "$archive" -C bundle
          bundle_dir="$(find bundle -maxdepth 1 -type d -name "sqlrs_*_darwin_${target_arch}" -print -quit)"
          if [[ -z "$bundle_dir" ]]; then
            echo "extracted darwin bundle directory not found" >&2
            exit 1
          fi
          echo "bundle_dir=$bundle_dir" >> "$GITHUB_OUTPUT"

      - name: Run darwin smoke checks
        if: matrix.os_family == 'darwin'
        id: smoke-darwin
        shell: bash
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/smoke-darwin"
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"
          node scripts/e2e-release/smoke-bundle.mjs \
            --sqlrs "${{ steps.bundle-darwin.outputs.bundle_dir }}/sqlrs" \
            --engine "${{ steps.bundle-darwin.outputs.bundle_dir }}/sqlrs-engine" \
            --out-dir "$out_dir"

      - name: Upload darwin smoke diagnostics
        if: failure() && matrix.os_family == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-darwin
          path: ${{ runner.temp }}/smoke-darwin

  publish-rc:
    if: contains(github.event.inputs.version || github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    needs: [assemble-release-manifest, e2e-happy, e2e-podman-macos, e2e-smoke]
    permissions:
      contents: write
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          pattern: sqlrs_*
          merge-multiple: true
          path: release-assets

      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-assets

      - name: Publish RC release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/sqlrs_*.tar.gz
            release-assets/sqlrs_*.zip
            release-assets/sqlrs_*.sha256
            release-assets/release-manifest.json

  promote-ga:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Find latest RC tag for this version
        id: rc
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          rc_tag="$(
            gh release list --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true) | .tagName' \
              | awk -v v="$version" 'index($0, v "-rc.") == 1' \
              | sort -V \
              | tail -n1
          )"
          if [[ -z "$rc_tag" ]]; then
            echo "no RC release found for ${version}" >&2
            exit 1
          fi
          echo "rc_tag=$rc_tag" >> "$GITHUB_OUTPUT"

      - name: Download RC assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-assets
          gh release download "${{ steps.rc.outputs.rc_tag }}" \
            --dir rc-assets \
            --pattern "sqlrs_${{ github.ref_name }}_*" \
            --clobber
          gh release download "${{ steps.rc.outputs.rc_tag }}" \
            --dir rc-assets \
            --pattern "release-manifest.json" \
            --clobber

      - name: Validate RC manifest provenance
        shell: bash
        run: |
          set -euo pipefail
          manifest="rc-assets/release-manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "release manifest is missing in RC assets" >&2
            exit 1
          fi

          manifest_source_sha="$(
            python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('source_sha',''))" "$manifest"
          )"
          if [[ -z "$manifest_source_sha" ]]; then
            echo "release manifest source_sha is empty" >&2
            exit 1
          fi
          if [[ "$manifest_source_sha" != "${{ github.sha }}" ]]; then
            echo "manifest source_sha ($manifest_source_sha) does not match tag commit (${{ github.sha }})" >&2
            exit 1
          fi

          manifest_version="$(
            python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('version',''))" "$manifest"
          )"
          if [[ "$manifest_version" != "${{ github.ref_name }}" ]]; then
            echo "manifest version ($manifest_version) does not match GA tag (${{ github.ref_name }})" >&2
            exit 1
          fi

      - name: Verify asset checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checksum_files=(rc-assets/*.sha256)
          if [[ ${#checksum_files[@]} -eq 0 ]]; then
            echo "no checksum files downloaded from RC release" >&2
            exit 1
          fi
          (
            cd rc-assets
            sha256sum -c ./*.sha256
          )

      - name: Publish GA release from verified RC assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            rc-assets/sqlrs_${{ github.ref_name }}_*.tar.gz
            rc-assets/sqlrs_${{ github.ref_name }}_*.zip
            rc-assets/sqlrs_${{ github.ref_name }}_*.sha256
            rc-assets/release-manifest.json
