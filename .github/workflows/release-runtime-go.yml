name: release-runtime-go

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate only, publish, or verify an existing publication
        type: choice
        options: [validate, publish, verify]
        default: validate
        required: true
      version:
        description: Exact nested module version (v0.MINOR.PATCH[-rc.N])
        required: true
      commit:
        description: Exact reviewed main source SHA (not the automation revision)
        required: true
      notes:
        description: Candidate Markdown, required only for candidate validate/publish
        required: false
      candidate_version:
        description: Same-source RC version, required for every final operation
        required: false

permissions:
  contents: read

concurrency:
  group: runtime-go-module-${{ inputs.version }}
  cancel-in-progress: false

env:
  INPUT_OPERATION: ${{ inputs.operation }}
  INPUT_VERSION: ${{ inputs.version }}
  INPUT_COMMIT: ${{ inputs.commit }}
  INPUT_NOTES: ${{ inputs.notes }}
  INPUT_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  GH_TOKEN: ${{ github.token }}
  SOURCE_ROOT: source

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      commit: ${{ steps.inputs.outputs.commit }}
      is_rc: ${{ steps.inputs.outputs.is_rc }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: inputs
        run: node automation/scripts/maintenance/runtime-go-release-cli.mjs inputs
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: source/backend/libs/runtime-go/go.mod
          cache: false
      - name: Verify source ancestry and module contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$INPUT_COMMIT"
          git -C source fetch --no-tags origin main:refs/remotes/origin/main
          git -C source merge-base --is-ancestor "$INPUT_COMMIT" origin/main
          test "$(head -n 1 source/backend/libs/runtime-go/go.mod)" = "module github.com/kimak-irmagi/sqlrs/backend/libs/runtime-go"
          grep -Fq 'retract v0.1.0' source/backend/libs/runtime-go/go.mod
          test -z "$(git -C source status --porcelain)"
      - name: Verify protected nested-tag policy before publication and source CI
        run: node automation/scripts/maintenance/runtime-go-release-cli.mjs source
      - name: Test trusted automation H
        working-directory: automation
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          node --test scripts/maintenance/runtime-go-release*.test.mjs
      - name: Unit, coverage, race, and fuzz smoke
        working-directory: source/backend/libs/runtime-go
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=10m -coverpkg=./... -covermode=count -coverprofile=coverage-runtime-all.out ./...
          runtime=$(go tool cover -func=coverage-runtime-all.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v value="$runtime" 'BEGIN { if (value + 0 < 95) exit 1 }'
          go test -race -count=1 -timeout=10m ./...
          go test -run '^$' -fuzz '^FuzzResolvedTransformJSON$' -fuzztime=2s -timeout=30s .
          go test -run '^$' -fuzz '^FuzzDecodeCanonicalExtensionIdentityJSON$' -fuzztime=2s -timeout=30s .
          go test -run '^$' -fuzz '^FuzzWorkspacePathAndEvidence$' -fuzztime=2s -timeout=30s ./resolver
          go test -run '^$' -fuzz '^FuzzDecodeCacheRecordJSON$' -fuzztime=2s -timeout=30s ./resolver
          go test -list '^FuzzExecutionEnvironmentInput$' ./schemas/sqlrs | grep -Fx FuzzExecutionEnvironmentInput
          go test -list '^FuzzExecutionEnvironmentIdentity$' ./schemas/sqlrs | grep -Fx FuzzExecutionEnvironmentIdentity
          go test -list '^FuzzCanonicalValueInspect$' . | grep -Fx FuzzCanonicalValueInspect
          go test -run '^$' -fuzz '^FuzzExecutionEnvironmentInput$' -fuzztime=2s -timeout=30s -parallel=2 ./schemas/sqlrs
          go test -run '^$' -fuzz '^FuzzExecutionEnvironmentIdentity$' -fuzztime=2s -timeout=30s -parallel=2 ./schemas/sqlrs
          go test -run '^$' -fuzz '^FuzzCanonicalValueInspect$' -fuzztime=2s -timeout=30s -parallel=2 .
      - name: Enforce exact execution-schema coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --test automation/scripts/maintenance/check-runtime-execution-coverage.test.mjs
          node automation/scripts/maintenance/check-runtime-execution-coverage.mjs source/backend/libs/runtime-go/coverage-runtime-all.out source | tee "$RUNNER_TEMP/coverage-runtime-execution.json"
      - name: Verify independent goldens and dependencies
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node automation/scripts/maintenance/verify-runtime-v2-golden.mjs source/backend/libs/runtime-go/testdata/golden
          node automation/scripts/maintenance/verify-runtime-v2-extension-golden.mjs source/backend/libs/runtime-go/testdata/extension-golden.json
          node automation/scripts/maintenance/verify-runtime-v2-canonical-bundle.mjs source/backend/libs/runtime-go/conformance/canonical-v1
          node --test automation/scripts/maintenance/verify-runtime-v2-canonical-bundle.test.mjs automation/scripts/maintenance/check-runtime-v2-bundle-policy.test.mjs automation/scripts/maintenance/create-runtime-v2-attestation.test.mjs
          baseline_tag=$(git -C source tag --merged "$INPUT_COMMIT" --list 'backend/libs/runtime-go/v*' --sort=-v:refname | grep -Fxv "backend/libs/runtime-go/$VERSION" | head -n 1 || true)
          if [[ -n "$baseline_tag" ]]; then
            (cd source && node "$GITHUB_WORKSPACE/automation/scripts/maintenance/check-runtime-v2-bundle-policy.mjs" "$baseline_tag")
          fi
          unexpected="$(cd source/backend/libs/runtime-go && go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^$' | grep -v '^github.com/kimak-irmagi/sqlrs/backend/libs/runtime-go\($\|/\)' || true)"
          test -z "$unexpected"
      - name: Source-tree clean consumer through staged proxy
        shell: bash
        run: |
          set -euo pipefail
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          staged_version=v0.0.0-pr.0
          go run ./automation/scripts/maintenance/stage-runtime-module.go source/backend/libs/runtime-go "$temp/proxy" "$staged_version"
          mkdir "$temp/consumer"
          cp source/test/runtime-v2-consumer/*_test.go "$temp/consumer/"
          cd "$temp/consumer"
          go mod init example.invalid/runtime-v2-consumer
          GOWORK=off GOPROXY="file://$temp/proxy" GOSUMDB=off go get "github.com/kimak-irmagi/sqlrs/backend/libs/runtime-go@$staged_version"
          GOWORK=off GOPROXY="file://$temp/proxy" GOSUMDB=off go test -count=1 ./...
      - name: Retain source diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-go-source-${{ github.run_attempt }}
          path: |
            source/backend/libs/runtime-go/coverage-runtime-all.out
            ${{ runner.temp }}/coverage-runtime-execution.json
            ${{ runner.temp }}/runtime-publication-*.json
          if-no-files-found: warn

  verify-candidate:
    needs: validate
    if: needs.validate.outputs.is_rc == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      body_digest: ${{ steps.consumer.outputs.body-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: source/backend/libs/runtime-go/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: ./automation/.github/actions/runtime-go-public-consumer
        id: consumer
        with:
          version: ${{ inputs.candidate_version }}
          commit: ${{ inputs.commit }}
          source-root: ${{ github.workspace }}/source
          automation-root: ${{ github.workspace }}/automation
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-go-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-*.json
          if-no-files-found: warn

  publish:
    needs: [validate, verify-candidate]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
      inputs.operation == 'publish' &&
      ((needs.validate.outputs.is_rc == 'true' && needs['verify-candidate'].result == 'skipped') ||
      (needs.validate.outputs.is_rc == 'false' && needs['verify-candidate'].result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Publish matching immutable coordinate
        env:
          CANDIDATE_DIGEST: ${{ needs['verify-candidate'].outputs.body_digest }}
        run: node automation/scripts/maintenance/runtime-go-release-cli.mjs publish
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-go-publish-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-publication-*.json
          if-no-files-found: warn

  verify-target:
    needs: [validate, verify-candidate, publish]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
      ((needs.validate.outputs.is_rc == 'true' && needs['verify-candidate'].result == 'skipped') ||
      (needs.validate.outputs.is_rc == 'false' && needs['verify-candidate'].result == 'success')) &&
      ((inputs.operation == 'publish' && needs.publish.result == 'success') ||
      (inputs.operation == 'verify' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: source/backend/libs/runtime-go/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: ./automation/.github/actions/runtime-go-public-consumer
        with:
          version: ${{ inputs.version }}
          commit: ${{ inputs.commit }}
          candidate-version: ${{ inputs.candidate_version }}
          source-root: ${{ github.workspace }}/source
          automation-root: ${{ github.workspace }}/automation
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-go-public-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-*.json
          if-no-files-found: warn
